name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

# 同一分支的新推送直接取消上一次运行，别让排队浪费时间。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  quality:
    name: 质量门禁
    # 外壳（slip-shell / src-tauri）只跑 Windows：它依赖 Win32 托盘、全局热键与 WebView2，
    # 在 Linux 上连编译都过不去。**假装整个应用跨平台会给出假的绿灯**——所以这里不假装。
    #
    # 但三个逻辑 crate（domain / store / app）确实没有平台依赖：它们零 I/O 或只用标准文件系统，
    # 不碰任何 Win32 API。把它们放到 Linux 上跑不是"装样子"，是**真的多一组证据**——
    # 每轮的 WSL 实测（282 项）一直就是这么做的，这里只是把它搬进 CI。
    # 见下方 `logic-linux` job。
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      # 编码守卫：*.ps1 必须带 UTF-8 BOM。
      # 与 .githooks/pre-commit 里的同一条检查对应——钩子可以被 --no-verify 绕过，
      # CI 不能。PowerShell 在没有 BOM 时会按 GBK 解码中文并报语法错，
      # 而报错位置和真正的原因（文件编码）毫无关系，排查成本极高。
      - name: 编码检查（*.ps1 必须有 BOM）
        shell: pwsh
        run: |
          $bad = @()
          Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object {
            $head = [IO.File]::ReadAllBytes($_.FullName) | Select-Object -First 3
            if ($head.Length -lt 3 -or $head[0] -ne 0xEF -or $head[1] -ne 0xBB -or $head[2] -ne 0xBF) {
              $bad += $_.FullName
            }
          }
          if ($bad.Count -gt 0) {
            Write-Output "以下 .ps1 缺少 UTF-8 BOM："
            $bad | ForEach-Object { Write-Output "  $_" }
            exit 1
          }
          Write-Output "全部 .ps1 均带 BOM"

      # BOM 只管编码，管不了语法。验收脚本被频繁手改，而语法错在 CI 里原本完全
      # 看不见——只会在有人本机跑那条命令时才暴露。实现与提交钩子共用一份。
      - name: PowerShell 语法检查
        shell: pwsh
        run: pwsh -NoProfile -File tools/check-ps1-syntax.ps1

      # 「不可回退的约束」里能被文本证据判定的部分（禁止引入的依赖、物理归档、
      # presenter 上锁、前端 HTML 注入）。纯 grep，毫秒级，与提交钩子共用同一份实现。
      - name: 常量：死代码与前后端镜像
        run: pwsh -NoProfile -File tools/check-dead-constants.ps1

      - name: 设计文档与代码同步
        run: pwsh -NoProfile -File tools/check-doc-sync.ps1

      - name: 门禁对等性（钩子与 CI 零漂移）
        run: pwsh -NoProfile -File tools/check-ci-parity.ps1

      - name: 不可回退的约束（禁止引入清单）
        shell: pwsh
        # `-SelfTest` 走真实 Include 路径（临时 Cargo.toml / tauri.conf.json），
        # 防止"正则对、但选不中文件"的守卫恒绿。
        run: pwsh -NoProfile -File tools/check-forbidden.ps1 -SelfTest

      - name: 安装 bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # 必须在任何 cargo 命令之前：`tauri::generate_context!` 在**编译期**读
      # `ui/dist`，而该目录不入库。顺序错了会得到一句 "proc macro panicked"。
      # 详见 src-tauri/build.rs 里的前置检查。
      - name: 构建前端产物
        working-directory: ui
        run: |
          bun install --frozen-lockfile
          bun run build

      # 格式检查排在构建之后：bun install 已在上一步完成，这里直接复用。
      # 单独成 step 是为了让"格式没过"和"构建没过"在日志里一眼可分。
      - name: 前端纯逻辑检查
        run: bun run tools/check-ui-logic.mjs

      - name: 前端产物体积门禁
        run: pwsh -NoProfile -File tools/check-bundle-size.ps1

      - name: 前端格式检查
        working-directory: ui
        run: bun run format:check

      - name: 缓存 Rust 产物
        uses: Swatinem/rust-cache@v2

      # 工具链版本由 rust-toolchain.toml 钉死，这里不重复声明。
      - name: 格式检查
        run: cargo fmt --all --check

      - name: Clippy（警告即错误）
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: 测试
        run: cargo test --workspace --locked

      # debug 能过不代表 release 能过：优化会改变 cfg 分支与某些 lint 的判定。
      - name: Release 构建
        run: cargo build --release -p slip-shell --locked

      # 端到端验收（真实热键 / 托盘 / 窗口定位）**不在 CI 里**：
      # 它需要一个交互式桌面会话和一个真实光标，runner 上跑不了。
      # 那部分只能在本机用 `pwsh -File tools/verify-hotkey.ps1` 兜。

  # 三个**纯逻辑**crate 的 Linux 验证（R125）。
  #
  # 明确边界：这个 job **不**构建 slip-shell，也不跑端到端。它证明的是
  # "领域/存储/app 三层与平台无关"——这正是它们的设计约束（`slip-domain` 零 I/O、
  # `slip-app` 无 GUI 依赖）。外壳那层仍由上面的 Windows job 负责。
  #
  # 为什么值得常驻：这条 job 会在"有人不小心把 Win32 调用写进 store"的第一时间变红。
  logic-linux:
    name: 逻辑层（Linux）
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust 工具链
        run: |
          rustup toolchain install --profile minimal --component clippy --component rustfmt
          rustup show active-toolchain

      - name: 缓存 Rust 产物
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: linux-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}

      - name: 逻辑层测试（domain / store / app）
        run: cargo test -p slip-domain -p slip-store -p slip-app --all-targets

      - name: 逻辑层 Clippy
        run: cargo clippy -p slip-domain -p slip-store -p slip-app --all-targets -- -D warnings

  # Linux 外壳（slip-shell / src-tauri）的编译与单测（R126）。
  #
  # 边界：这个 job **只**验证 Linux 外壳能编译、能跑 lib 单测（presenter / 队列等
  # 与平台无关的部分）。它**不**跑 GUI，也**不**跑端到端——真实热键、托盘、窗口定位
  # 仍然只能由 Windows 的 `quality` job 与本机 verify-hotkey.ps1 负责。
  #
  # 目的不是"宣布跨平台"，而是让 Linux 侧的编译回归在 CI 里早一点变红，
  # 而不是等到某个开发者在 WSL 里手跑才发现。
  shell-linux:
    name: 外壳（Linux）
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      # Tauri v2 在 Linux 上编译所需的系统依赖（WebKitGTK / GTK / 托盘 / SVG / 链接工具）。
      # 注意 Ubuntu 版本差异：24.04 起用 libayatana-appindicator3-dev，
      # 更老的镜像可能只有 libappindicator3-dev；此处只走标准 apt 命令，不写条件脚本。
      - name: 安装 Tauri Linux 构建依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev

      - name: 安装 Rust 工具链
        run: |
          rustup toolchain install --profile minimal --component clippy --component rustfmt
          rustup show active-toolchain

      - name: 缓存 Rust 产物
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: linux-shell-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}

      - name: 安装 bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # 必须在任何 cargo 命令之前：`tauri::generate_context!` 在编译期读 `ui/dist`。
      - name: 构建前端产物
        working-directory: ui
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Linux 外壳 Clippy
        run: cargo clippy -p slip-shell --all-targets --locked -- -D warnings

      - name: Linux 外壳构建
        run: cargo build -p slip-shell --locked

      - name: Linux 外壳单测
        run: cargo test -p slip-shell --lib --locked
